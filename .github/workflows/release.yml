name: Release

# v* 태그를 push하면 DMG를 빌드해 GitHub Release에 올립니다. (보조 경로)
# 참고: 런너의 Xcode가 이 프로젝트(최신 포맷)를 못 열면 실패할 수 있습니다.
# 그 경우 로컬에서 `scripts/release.sh <version>` 으로 배포하세요.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build & package DMG
        run: bash scripts/package-dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pomopet-*.dmg
          name: Pomopet ${{ steps.ver.outputs.version }}
          body: |
            내가 올린 캐릭터를 키우는 메뉴바 포모도로.

            미서명 빌드입니다 — 첫 실행 시 우클릭 → 열기, 또는:
            `xattr -dr com.apple.quarantine /Applications/Pomopet.app`
